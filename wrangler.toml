name = "flavinhobot"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

# Revalidação diária (06:00 UTC = 03:00 em São Paulo)
[triggers]
crons = ["0 6 * * *"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "flavinhobot"
database_id = "COLE_AQUI_O_ID_DO_D1"   # saída de `wrangler d1 create flavinhobot`
migrations_dir = "migrations"

# No deploy pelo GitHub Actions, PUBLIC_BASE_URL, PROTECTED_CHAT_IDS, ADMIN_CHAT_ID, ADMIN_IDS
# e o database_id vêm das variáveis do environment "production" (docs/DEPLOY.md).
# Os valores abaixo só valem para deploy manual.
[vars]
PUBLIC_BASE_URL = "https://flavinhobot.SUA-CONTA.workers.dev"
PROTECTED_CHAT_IDS = ""            # ex.: "-1001234567890,-1009876543210"
ADMIN_CHAT_ID = "0"                # chat privado dos admins
ADMIN_IDS = "0"                    # telegram_ids dos admins, separados por vírgula
ALLOWED_CAMPUS_IDS = "20"          # 42 São Paulo; vazio = qualquer campus
ALLOW_STAFF = "true"
REVERIFY_DAYS = "30"
AUTO_REMOVE = "false"
JOIN_REQUEST_TIMEOUT_HOURS = "24"
GRANDFATHER_DAYS = "14"
INTRA_MAIN_CURSUS_ID = "21"        # 42cursus
REVERIFY_MAX_PER_RUN = "30"

# Secrets (NUNCA aqui): wrangler secret put <NOME>
#   TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, INTRA_CLIENT_ID, INTRA_CLIENT_SECRET
