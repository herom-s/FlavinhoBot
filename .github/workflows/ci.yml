name: CI

# Em push na main, quem chama este workflow é o deploy.yml (evita rodar duas vezes).
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      # Vitest roda em Node e os testes usam node:sqlite (Node >= 22.5)
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache do Bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Testes
        run: bun run test

      - name: Build do Worker (dry-run)
        run: bun run build
