name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy para produção
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PUBLIC_BASE_URL }}
    env:
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      PROTECTED_CHAT_IDS: ${{ vars.PROTECTED_CHAT_IDS }}
      ADMIN_CHAT_ID: ${{ vars.ADMIN_CHAT_ID }}
      ADMIN_IDS: ${{ vars.ADMIN_IDS }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      INTRA_CLIENT_ID: ${{ secrets.INTRA_CLIENT_ID }}
      INTRA_CLIENT_SECRET: ${{ secrets.INTRA_CLIENT_SECRET }}
    steps:
      - name: Conferir configuração
        id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Deploy pulado: configure o environment 'production' (veja docs/DEPLOY.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          for name in PUBLIC_BASE_URL ADMIN_CHAT_ID ADMIN_IDS D1_DATABASE_ID \
                      CLOUDFLARE_ACCOUNT_ID TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET \
                      INTRA_CLIENT_ID INTRA_CLIENT_SECRET; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltam no environment 'production':$missing"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.cfg.outputs.ready == 'true'

      - uses: oven-sh/setup-bun@v2
        if: steps.cfg.outputs.ready == 'true'

      - name: Instalar dependências
        if: steps.cfg.outputs.ready == 'true'
        run: bun install --frozen-lockfile

      - name: Apontar o wrangler.toml para o banco de produção
        if: steps.cfg.outputs.ready == 'true'
        run: sed -i "s/COLE_AQUI_O_ID_DO_D1/${D1_DATABASE_ID}/" wrangler.toml

      - name: Montar variáveis do Worker
        id: vars
        if: steps.cfg.outputs.ready == 'true'
        run: |
          args=""
          for name in PUBLIC_BASE_URL PROTECTED_CHAT_IDS ADMIN_CHAT_ID ADMIN_IDS; do
            value="${!name// /}"
            [ -n "$value" ] && args="$args --var $name:$value"
          done
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Migrations, secrets e deploy
        if: steps.cfg.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: wrangler d1 migrations apply flavinhobot --remote
          command: deploy${{ steps.vars.outputs.args }}
          secrets: |
            TELEGRAM_BOT_TOKEN
            TELEGRAM_WEBHOOK_SECRET
            INTRA_CLIENT_ID
            INTRA_CLIENT_SECRET

      - name: Smoke test (/health)
        if: steps.cfg.outputs.ready == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS "${PUBLIC_BASE_URL%/}/health") && echo "$body" | grep -q '"ok":true' && { echo "$body"; exit 0; }
            echo "Tentativa $i falhou, esperando..."; sleep 10
          done
          echo "::error::/health não respondeu ok"; exit 1

      - name: Sincronizar webhook e comandos do Telegram
        if: steps.cfg.outputs.ready == 'true'
        run: bun run set-webhook
